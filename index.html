<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITN (v7.0) Comprehensive Practice Quiz - NetAcad Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        netacadBg: '#f8fafc',
                        cardBg: '#ffffff',
                        borderCol: '#cbd5e1',
                        sideBoxBg: '#f1f5f9',
                        accentBlue: '#007bb8'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #edf2f7;
            --bg-elev: #ffffff;
            --bg-soft: #f5f7fb;
            --panel: #ffffff;
            --panel-alt: #f8fafc;
            --text: #1f2937;
            --muted: #64748b;
            --border: #dbe3ee;
            --primary: #0d6ead;
            --primary-strong: #0b5d99;
            --primary-soft: #eaf4ff;
            --success-bg: #ebf9f1;
            --success-border: #6ec59b;
            --success-text: #106b45;
            --danger-bg: #fff1f2;
            --danger-border: #ef9ca4;
            --danger-text: #a33442;
            --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            --tab-bg: #e8edf6;
            --tab-active: linear-gradient(135deg, #0c7ec9 0%, #0f5ea8 100%);
            --tab-ink: #13314d;
            --header-bg: rgba(255,255,255,0.85);
            --header-ink: #0f172a;
            --module-panel: #ffffff;
            --module-panel-ink: #1f2937;
            --timer-bg: #f8fafc;
            --nav-button-bg: #e2e8f0;
            --nav-button-hover: #cbd5e1;
            --footer-bg: #ffffff;
        }

        body[data-theme="dark"] {
            --bg: #0b1422;
            --bg-elev: #111c2f;
            --bg-soft: #101d30;
            --panel: #101d30;
            --panel-alt: #132338;
            --text: #edf3ff;
            --muted: #9aa9bd;
            --border: #23344d;
            --primary: #66b1ff;
            --primary-strong: #8bc1ff;
            --primary-soft: #142d49;
            --success-bg: #102e22;
            --success-border: #2d9a6a;
            --success-text: #9ce7bf;
            --danger-bg: #301b2a;
            --danger-border: #d65d77;
            --danger-text: #ffc7d1;
            --shadow: 0 12px 28px rgba(2, 6, 23, 0.45);
            --tab-bg: #1b2c42;
            --tab-active: linear-gradient(135deg, #3d9bf5 0%, #2d6edb 100%);
            --tab-ink: #e5f1ff;
            --header-bg: rgba(11, 20, 34, 0.78);
            --header-ink: #edf3ff;
            --module-panel: #0f1d2d;
            --module-panel-ink: #edf3ff;
            --timer-bg: rgba(19, 35, 58, 0.8);
            --nav-button-bg: #1b2c42;
            --nav-button-hover: #263d5a;
            --footer-bg: #0f1d2d;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .module-tab {
            background: var(--tab-bg);
            color: var(--tab-ink);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.65rem 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }

        .module-tab.active {
            background: var(--tab-active);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 8px 18px rgba(13, 110, 173, 0.25);
        }

        .module-tab:hover {
            transform: translateY(-1px);
        }

        .content-shell {
            max-width: 1200px;
            margin: 0 auto;
        }

        .sticky-header {
            background: var(--header-bg);
            color: var(--header-ink);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 10px rgba(15,23,42,0.03);
        }

        .theme-toggle {
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: var(--text);
            border-radius: 999px;
            padding: 0.5rem 0.9rem;
            font-weight: 700;
            font-size: 0.78rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .module-strip {
            background: var(--module-panel);
            color: var(--module-panel-ink);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .module-strip .module-tab {
            background: var(--tab-bg);
            color: var(--tab-ink);
        }

        .module-strip .module-tab.active {
            background: var(--tab-active);
            color: #ffffff;
        }

        .site-title {
            color: var(--header-ink);
        }

        .navigation-panel {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        #prev-btn {
            background: var(--nav-button-bg);
            color: var(--text);
            border-color: var(--border);
        }

        #prev-btn:hover:not(:disabled) {
            background: var(--nav-button-hover);
        }

        #progress-indicator {
            color: var(--text);
        }

        .site-footer {
            background: var(--footer-bg);
            color: var(--muted);
            border-color: var(--border);
        }

        .completed-panel {
            background: var(--panel);
            color: var(--text);
            border-color: var(--border);
        }

        .completed-panel h2 {
            color: var(--text);
        }

        .completed-panel p {
            color: var(--muted);
        }

        .completed-panel .score-value {
            color: var(--primary-strong);
        }

        .completed-panel .success-rate {
            background: var(--primary-soft);
            border: 1px solid var(--border);
            color: var(--primary-strong);
        }

        #overall-timer {
            background: var(--timer-bg);
            color: var(--primary-strong);
            border-color: var(--border);
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            border-color: var(--primary);
        }

        #quiz-container {
            display: block;
        }

        .question-shell {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 1rem;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .question-status {
            background: var(--panel-alt);
            border-right: 1px solid var(--border);
            padding: 1rem 1rem 0.9rem;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 100%;
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            background: var(--primary-soft);
            color: var(--primary-strong);
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
        }

        .status-block {
            margin-top: 0.9rem;
            font-size: 0.78rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .status-inline {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 0.55rem;
            font-weight: 600;
            color: var(--text);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            display: inline-block;
        }

        .flag-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.7rem;
            font-size: 0.75rem;
            color: var(--text);
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.6rem;
        }

        .flag-toggle input {
            accent-color: var(--primary);
            width: 1rem;
            height: 1rem;
        }

        .question-main {
            padding: 1.2rem 1.25rem 1.1rem;
        }

        .question-text {
            margin: 0 0 1rem 0;
            font-size: 1.04rem;
            line-height: 1.6;
            color: var(--text);
            font-weight: 500;
        }

        .option-list {
            display: grid;
            gap: 0.7rem;
            margin-bottom: 1.1rem;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            width: 100%;
            gap: 0.75rem;
            padding: 0.75rem 0.8rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: var(--text);
            text-align: left;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
        }

        .option-item:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .option-letter {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(148, 163, 184, 0.1);
            color: var(--muted);
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option-item.correct {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        .option-item.correct .option-letter {
            background: var(--success-border);
            border-color: var(--success-border);
            color: #ffffff;
        }

        .option-item.wrong {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger-text);
        }

        .option-item.wrong .option-letter {
            background: var(--danger-border);
            border-color: var(--danger-border);
            color: #ffffff;
        }

        .option-item.disabled {
            opacity: 0.78;
            cursor: default;
        }

        .option-item .option-label {
            font-weight: 700;
            color: var(--muted);
            margin-right: 0.2rem;
        }

        .answer-explanation {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.9rem 1rem;
            font-size: 0.92rem;
            line-height: 1.65;
        }

        .answer-explanation strong {
            color: var(--primary-strong);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.35rem;
        }

        .answer-explanation p {
            margin: 0;
            color: var(--text);
        }

        @media (max-width: 768px) {
            .question-shell {
                grid-template-columns: 1fr;
            }
            .question-status {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body data-theme="light" class="min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">
    <header class="sticky-header sticky top-0 z-50 border-b border-borderCol shadow-sm p-4">
        <div class="content-shell flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="site-title text-base sm:text-lg font-bold tracking-tight flex items-center gap-2">
                <span class="bg-sky-700 text-white text-xs px-2.5 py-1 rounded font-mono">ITN v7.0</span> CCNA Modules 1–16 Practice Exam
            </h1>
            <div class="flex items-center gap-3">
                <div id="overall-timer" class="text-sm border px-3 py-1 rounded font-mono font-semibold">Time: 00:00</div>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">🌙 Dark</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full p-4 flex-grow my-6">
        <!-- Module Selection Tabs -->
        <div class="module-strip flex flex-wrap gap-2 mb-6 p-3 rounded-xl max-h-48 overflow-y-auto">
            <button onclick="switchModule(1)" id="tab-1" class="module-tab active px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 1 (Intro)</button>
            <button onclick="switchModule(2)" id="tab-2" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 2 (Switching/CLI)</button>
            <button onclick="switchModule(3)" id="tab-3" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 3 (Protocols)</button>
            <button onclick="switchModule(4)" id="tab-4" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 4 (Physical)</button>
            <button onclick="switchModule(5)" id="tab-5" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 5 (Number Systems)</button>
            <button onclick="switchModule(6)" id="tab-6" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 6 (Data Link)</button>
            <button onclick="switchModule(7)" id="tab-7" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 7 (Ethernet)</button>
            <button onclick="switchModule(8)" id="tab-8" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 8 (Network Layer)</button>
            <button onclick="switchModule(9)" id="tab-9" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 9 (IPv6)</button>
            <button onclick="switchModule(10)" id="tab-10" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 10 (IP Addressing)</button>
            <button onclick="switchModule(11)" id="tab-11" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 11 (Subnetting IPv4)</button>
            <button onclick="switchModule(12)" id="tab-12" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 12 (IPv6)</button>
            <button onclick="switchModule(13)" id="tab-13" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 13 (ICMP)</button>
            <button onclick="switchModule(14)" id="tab-14" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 14 (Transport)</button>
            <button onclick="switchModule(15)" id="tab-15" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 15 (Application)</button>
            <button onclick="switchModule(16)" id="tab-16" class="module-tab px-3 py-1.5 rounded-lg font-medium text-xs transition-colors border border-borderCol">Mod 16 (Security)</button>
        </div>

        <!-- NetAcad Style Question Layout Container -->
        <div id="quiz-container" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
            <!-- Rendered dynamically -->
        </div>

        <!-- Navigation and Actions -->
        <div class="navigation-panel flex justify-between items-center mt-6 p-4 rounded-xl">
            <button onclick="prevQuestion()" id="prev-btn" class="bg-slate-200 hover:bg-slate-300 border border-borderCol text-slate-700 px-5 py-2.5 rounded-xl font-medium transition-all disabled:opacity-40 disabled:cursor-not-allowed">Previous</button>
            <div id="progress-indicator" class="text-sm font-semibold text-slate-600">Question 1 of 10</div>
            <button onclick="nextQuestion()" id="next-btn" class="bg-sky-700 hover:bg-sky-600 text-white px-6 py-2.5 rounded-xl font-medium shadow-sm transition-all">Next</button>
        </div>
    </main>

    <footer class="site-footer border-t text-center py-4 mt-8">
        <p class="text-xs">Cisco CCNA Introduction to Networks (ITN v7.0) NetAcad Simulation &copy; 2026</p>
    </footer>

                    rationale: "The minimum recommended RSA key size for SSH is 1024 bits."

                {

                    options: [

                        "Configure guest access without passwords",

                    ],

        let currentModule = 1;
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = {};
        let startTime = Date.now();
        let timerInterval;

        for (let mod in quizData) {
            userAnswers[mod] = {};
            flaggedQuestions[mod] = {};
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const seconds = String(elapsed % 60).padStart(2, '0');
                document.getElementById('overall-timer').innerText = `Time: ${minutes}:${seconds}`;
            }, 1000);
        }

        function switchModule(modNum) {
            currentModule = modNum;
            currentQuestionIndex = 0;

            document.querySelectorAll('.module-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeTab = document.getElementById(`tab-${modNum}`);
            if (activeTab) {
                activeTab.classList.add('active');
            }

            renderQuestion();
        }

        function renderQuestion() {
            const container = document.getElementById('quiz-container');
            const questions = quizData[currentModule];
            const q = questions[currentQuestionIndex];
            const savedAnswer = userAnswers[currentModule][currentQuestionIndex];
            const isFlagged = flaggedQuestions[currentModule][currentQuestionIndex] || false;
            const alphabetLabels = ['a.', 'b.', 'c.', 'd.', 'e.'];

            let html = `
                <div class="question-shell">
                    <aside class="question-status">
                        <div class="question-number">Question ${currentQuestionIndex + 1}</div>
                        <div class="status-block">
                            <div class="status-inline"><span class="status-dot"></span> ${savedAnswer !== undefined ? 'Complete' : 'Not yet answered'}</div>
                            <div>Marked 0.00 out of 3.00</div>
                        </div>
                        <label class="flag-toggle" for="flag-checkbox">
                            <input type="checkbox" id="flag-checkbox" ${isFlagged ? 'checked' : ''} onchange="toggleFlag()">
                            <span>${isFlagged ? 'Remove flag' : 'Flag question'}</span>
                        </label>
                    </aside>

                    <div class="question-main">
                        <h2 class="question-text">${q.question}</h2>
                        <div class="option-list">
            `;

            q.options.forEach((opt, idx) => {
                let optionClass = 'option-item';

                if (savedAnswer !== undefined) {
                    if (idx === q.correct) {
                        optionClass += ' correct';
                    } else if (idx === savedAnswer) {
                        optionClass += ' wrong';
                    } else {
                        optionClass += ' disabled';
                    }
                }

                html += `
                    <button type="button" onclick="selectOption(${idx})" ${savedAnswer !== undefined ? 'disabled' : ''} class="${optionClass}">
                        <span class="option-letter">${savedAnswer !== undefined && idx === q.correct ? '✓' : (savedAnswer !== undefined && idx === savedAnswer && idx !== q.correct ? '✕' : alphabetLabels[idx].replace('.', ''))}</span>
                        <span class="option-text"><span class="option-label">${alphabetLabels[idx]}</span> ${opt}</span>
                    </button>
                `;
            });

            html += `</div>`;

            if (savedAnswer !== undefined) {
                html += `
                    <div class="answer-explanation">
                        <strong>Hint</strong>
                        <p>${q.hint}</p>
                        <div style="height: 0.8rem;"></div>
                        <strong>Rationale & Explanation</strong>
                        <p>${q.rationale}</p>
                    </div>
                `;
            }

            html += `</div></div>`;

            container.innerHTML = html;
            document.getElementById('progress-indicator').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            const moduleKeys = Object.keys(quizData).map(Number);
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0 && currentModule === moduleKeys[0];
        }

        function selectOption(optIndex) {
            userAnswers[currentModule][currentQuestionIndex] = optIndex;
            renderQuestion();
        }

        function toggleFlag() {
            const isChecked = document.getElementById('flag-checkbox').checked;
            flaggedQuestions[currentModule][currentQuestionIndex] = isChecked;
            renderQuestion();
        }

        function nextQuestion() {
            const questions = quizData[currentModule];
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                const moduleKeys = Object.keys(quizData).map(Number);
                const currentIdx = moduleKeys.indexOf(currentModule);
                if (currentIdx < moduleKeys.length - 1) {
                    switchModule(moduleKeys[currentIdx + 1]);
                } else {
                    showFinalScore();
                }
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            } else {
                const moduleKeys = Object.keys(quizData).map(Number);
                const currentIdx = moduleKeys.indexOf(currentModule);
                if (currentIdx > 0) {
                    const prevMod = moduleKeys[currentIdx - 1];
                    switchModule(prevMod);
                    currentQuestionIndex = quizData[prevMod].length - 1;
                    renderQuestion();
                }
            }
        }

        function showFinalScore() {
            clearInterval(timerInterval);
            let totalCorrect = 0;
            let totalQuestions = 0;

            for (let mod in quizData) {
                quizData[mod].forEach((q, idx) => {
                    totalQuestions++;
                    if (userAnswers[mod][idx] === q.correct) {
                        totalCorrect++;
                    }
                });
            }

            const percentage = Math.round((totalCorrect / totalQuestions) * 100);
            const container = document.getElementById('quiz-container');
            container.innerHTML = `
                <div class="completed-panel col-span-4 p-10 rounded-xl text-center space-y-6">
                    <h2 class="text-3xl font-extrabold">Modules 1–16 Exam Completed! 🎉</h2>
                    <p class="text-lg">You answered <span class="score-value font-bold">${totalCorrect}</span> out of <span class="font-bold">${totalQuestions}</span> questions correctly.</p>
                    <div class="success-rate inline-block p-5 rounded-2xl font-bold text-xl">
                        Success Rate: ${percentage}%
                    </div>
                    <div>
                        <button onclick="resetQuiz()" class="bg-sky-700 hover:bg-sky-600 text-white px-8 py-3 rounded-xl font-semibold shadow-sm transition-all">Retake Quiz</button>
                    </div>
                </div>
            `;
            document.getElementById('prev-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('progress-indicator').style.display = 'none';
        }

        function resetQuiz() {
            for (let mod in quizData) {
                userAnswers[mod] = {};
                flaggedQuestions[mod] = {};
            }
            startTime = Date.now();
            startTimer();
            document.getElementById('prev-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'inline-block';
            document.getElementById('progress-indicator').style.display = 'block';
            const moduleKeys = Object.keys(quizData).map(Number);
            switchModule(moduleKeys[0]);
        }

        function applyTheme(theme) {
            const body = document.body;
            const safeTheme = theme === 'dark' ? 'dark' : 'light';
            body.dataset.theme = safeTheme;
            const themeBtn = document.getElementById('theme-toggle');
            if (themeBtn) {
                themeBtn.textContent = safeTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
                themeBtn.setAttribute('aria-label', safeTheme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
            }
            try {
                localStorage.setItem('cn-theme', safeTheme);
            } catch (error) {
                // Ignore storage errors in restricted browser contexts.
            }
        }

        function toggleTheme() {
            const body = document.body;
            const nextTheme = body.dataset.theme === 'dark' ? 'light' : 'dark';
            applyTheme(nextTheme);
        }

        const savedTheme = (() => {
            try {
                return localStorage.getItem('cn-theme');
            } catch (error) {
                return null;
            }
        })();

        applyTheme(savedTheme || 'light');
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        startTimer();
        const initialModuleKeys = Object.keys(quizData).map(Number);
        switchModule(initialModuleKeys[0]);
    </script>
