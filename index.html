<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITN (v7.0) Comprehensive Practice Quiz - NetAcad Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        netacadBg: '#f8fafc',
                        cardBg: '#ffffff',
                        borderCol: '#cbd5e1',
                        sideBoxBg: '#f1f5f9',
                        accentBlue: '#007bb8'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #f5f5f5;
            --bg-elev: #ffffff;
            --bg-soft: #f8f9fa;
            --panel: #ffffff;
            --panel-alt: #f8fafc;
            --text: #212529;
            --muted: #5f6b75;
            --border: #d6dce1;
            --primary: #0f6cbf;
            --primary-strong: #0b5cad;
            --primary-soft: #e7f1f8;
            --success-bg: #ebf9f1;
            --success-border: #6ec59b;
            --success-text: #106b45;
            --danger-bg: #fff1f2;
            --danger-border: #ef9ca4;
            --danger-text: #a33442;
            --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            --tab-bg: #f8f9fa;
            --tab-active: #0f6cbf;
            --tab-ink: #343a40;
            --header-bg: #ffffff;
            --header-ink: #212529;
            --module-panel: #ffffff;
            --module-panel-ink: #212529;
            --timer-bg: #f8fafc;
            --nav-button-bg: #f1f3f5;
            --nav-button-hover: #e2e6ea;
            --footer-bg: #ffffff;
            --progress-track: #e9ecef;
            --progress-low: #dc3545;
            --progress-medium: #d99a00;
            --progress-high: #198754;
            --scrollbar-track: #e8edf2;
            --scrollbar-thumb: #aab5bf;
        }

        body[data-theme="dark"] {
            --bg: #0b1422;
            --bg-elev: #111c2f;
            --bg-soft: #101d30;
            --panel: #101d30;
            --panel-alt: #132338;
            --text: #edf3ff;
            --muted: #9aa9bd;
            --border: #23344d;
            --primary: #66b1ff;
            --primary-strong: #8bc1ff;
            --primary-soft: #142d49;
            --success-bg: #102e22;
            --success-border: #2d9a6a;
            --success-text: #9ce7bf;
            --danger-bg: #301b2a;
            --danger-border: #d65d77;
            --danger-text: #ffc7d1;
            --shadow: 0 12px 28px rgba(2, 6, 23, 0.45);
            --tab-bg: #1b2c42;
            --tab-active: linear-gradient(135deg, #3d9bf5 0%, #2d6edb 100%);
            --tab-ink: #e5f1ff;
            --header-bg: rgba(11, 20, 34, 0.78);
            --header-ink: #edf3ff;
            --module-panel: #0f1d2d;
            --module-panel-ink: #edf3ff;
            --timer-bg: rgba(19, 35, 58, 0.8);
            --nav-button-bg: #1b2c42;
            --nav-button-hover: #263d5a;
            --footer-bg: #0f1d2d;
            --progress-track: #24384b;
            --progress-low: #f16b78;
            --progress-medium: #f0bf4c;
            --progress-high: #42bd82;
            --scrollbar-track: #101d30;
            --scrollbar-thumb: #38536e;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .module-tab {
            background: var(--tab-bg);
            color: var(--tab-ink);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.55rem 0.85rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0;
            transition: all 0.2s ease;
            box-shadow: none;
        }

        .module-tab.active {
            background: var(--tab-active);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 2px 4px rgba(15, 108, 191, 0.2);
        }

        .module-tab:hover {
            transform: translateY(-1px);
        }

        .content-shell {
            max-width: 1200px;
            margin: 0 auto;
        }

        .sticky-header {
            background: var(--header-bg);
            color: var(--header-ink);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 10px rgba(15,23,42,0.03);
        }

        .theme-toggle {
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: var(--text);
            border-radius: 999px;
            padding: 0.5rem 0.9rem;
            font-weight: 700;
            font-size: 0.78rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .quiz-main {
            max-width: 1440px;
        }

        .quiz-layout {
            display: grid;
            grid-template-columns: 270px minmax(0, 1fr);
            align-items: start;
            gap: 1.25rem;
            transition: grid-template-columns 0.25s ease;
        }

        .quiz-layout.sidebar-collapsed {
            grid-template-columns: 54px minmax(0, 1fr);
        }

        .module-sidebar {
            position: sticky;
            top: 5.5rem;
            min-width: 0;
        }

        .module-sidebar-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            padding: 0 0.2rem;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .sidebar-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            flex: 0 0 auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .sidebar-toggle:hover {
            background: var(--primary-soft);
            border-color: var(--primary);
        }

        .sidebar-toggle svg {
            width: 1rem;
            height: 1rem;
            transition: transform 0.25s ease;
        }

        .module-sidebar.collapsed .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        .module-strip {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            max-height: calc(100vh - 7rem);
            overflow-y: auto;
            padding: 0.65rem;
            background: var(--module-panel);
            color: var(--module-panel-ink);
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(33, 37, 41, 0.08);
            border-radius: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        .module-strip::-webkit-scrollbar {
            width: 10px;
        }

        .module-strip::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 999px;
        }

        .module-strip::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border: 2px solid var(--scrollbar-track);
            border-radius: 999px;
        }

        .module-strip::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .module-sidebar.collapsed .module-sidebar-heading {
            justify-content: center;
        }

        .module-sidebar.collapsed .module-sidebar-title,
        .module-sidebar.collapsed .module-strip {
            display: none;
        }

        .module-strip .module-tab {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.55rem;
            width: 100%;
            background: var(--tab-bg);
            color: var(--tab-ink);
            border-radius: 6px;
            padding: 0.7rem 0.75rem;
            text-align: left;
        }

        .module-strip .module-tab.active {
            background: var(--tab-active);
            color: #ffffff;
        }

        .module-tab-title {
            line-height: 1.35;
        }

        .module-progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            color: var(--muted);
            font-size: 0.68rem;
            font-weight: 600;
        }

        .module-strip .module-tab.active .module-progress-meta {
            color: currentColor;
            opacity: 0.88;
        }

        .module-progress-track {
            display: block;
            height: 5px;
            width: 100%;
            overflow: hidden;
            border-radius: 999px;
            background: var(--progress-track);
        }

        .module-progress-fill {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: var(--muted);
            transition: width 0.45s ease, background-color 0.2s ease;
        }

        .module-tab[data-score-state="low"] .module-progress-fill,
        .module-tab[data-score-state="low"] .module-progress-meta {
            background-color: var(--progress-low);
        }

        .module-tab[data-score-state="medium"] .module-progress-fill,
        .module-tab[data-score-state="medium"] .module-progress-meta {
            background-color: var(--progress-medium);
        }

        .module-tab[data-score-state="high"] .module-progress-fill,
        .module-tab[data-score-state="high"] .module-progress-meta {
            background-color: var(--progress-high);
        }

        .module-tab[data-score-state="low"] .module-progress-meta,
        .module-tab[data-score-state="medium"] .module-progress-meta,
        .module-tab[data-score-state="high"] .module-progress-meta {
            background: transparent;
        }

        .module-tab[data-score-state="low"] .module-progress-status { color: var(--progress-low); }
        .module-tab[data-score-state="medium"] .module-progress-status { color: var(--progress-medium); }
        .module-tab[data-score-state="high"] .module-progress-status { color: var(--progress-high); }

        .module-tab.active .module-progress-status {
            color: currentColor;
        }

        .quiz-content {
            min-width: 0;
        }

        .site-title {
            color: var(--header-ink);
        }

        .navigation-panel {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(33, 37, 41, 0.08);
            border-radius: 8px;
        }

        #prev-btn,
        #next-btn {
            border-radius: 6px;
        }

        #prev-btn {
            background: var(--nav-button-bg);
            color: var(--text);
            border-color: var(--border);
        }

        #prev-btn:hover:not(:disabled) {
            background: var(--nav-button-hover);
        }

        #progress-indicator {
            color: var(--text);
        }

        .site-footer {
            background: var(--footer-bg);
            color: var(--muted);
            border-color: var(--border);
        }

        .completed-panel {
            background: var(--panel);
            color: var(--text);
            border-color: var(--border);
        }

        .completed-panel h2 {
            color: var(--text);
        }

        .completed-panel p {
            color: var(--muted);
        }

        .completed-panel .score-value {
            color: var(--primary-strong);
        }

        .completed-panel .success-rate {
            background: var(--primary-soft);
            border: 1px solid var(--border);
            color: var(--primary-strong);
        }

        #overall-timer {
            background: var(--timer-bg);
            color: var(--primary-strong);
            border-color: var(--border);
        }

        .brand-badge,
        #next-btn {
            background: var(--primary);
        }

        #next-btn:hover {
            background: var(--primary-strong);
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            border-color: var(--primary);
        }

        #quiz-container {
            display: block;
        }

        .question-shell {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(33, 37, 41, 0.08);
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .question-shell.question-enter-next {
            animation: question-enter-next 0.28s ease-out both;
        }

        .question-shell.question-enter-previous {
            animation: question-enter-previous 0.28s ease-out both;
        }

        .question-shell.question-enter-module {
            animation: question-enter-module 0.32s ease-out both;
        }

        .question-shell.question-enter-answer {
            animation: question-enter-answer 0.24s ease-out both;
        }

        @keyframes question-enter-next {
            from { opacity: 0; transform: translateX(16px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes question-enter-previous {
            from { opacity: 0; transform: translateX(-16px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes question-enter-module {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes question-enter-answer {
            from { opacity: 0.65; }
            to { opacity: 1; }
        }

        .question-status {
            background: var(--panel-alt);
            border-right: 1px solid var(--border);
            padding: 1rem 1rem 0.9rem;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 100%;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            background: var(--primary-soft);
            color: var(--primary-strong);
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
        }

        .status-block {
            margin-top: 0.9rem;
            font-size: 0.78rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .status-inline {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-top: 0.55rem;
            font-weight: 600;
            color: var(--text);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            display: inline-block;
        }

        .flag-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.7rem;
            font-size: 0.75rem;
            color: var(--text);
            width: 100%;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.6rem;
        }

        .flag-toggle input {
            accent-color: var(--primary);
            width: 1rem;
            height: 1rem;
        }

        .question-main {
            padding: 1.2rem 1.25rem 1.1rem;
        }

        .question-text {
            margin: 0 0 1rem 0;
            font-size: 1.04rem;
            line-height: 1.6;
            color: var(--text);
            font-weight: 500;
        }

        .option-list {
            display: grid;
            gap: 0.7rem;
            margin-bottom: 1.1rem;
        }

        .option-item {
            display: flex;
            align-items: flex-start;
            width: 100%;
            gap: 0.75rem;
            padding: 0.75rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            text-align: left;
            transition: all 0.2s ease;
            box-shadow: none;
        }

        .option-item:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .option-letter {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(148, 163, 184, 0.1);
            color: var(--muted);
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .option-item.correct {
            background: var(--success-bg);
            border-color: var(--success-border);
            color: var(--success-text);
        }

        .option-item.correct.answer-reveal {
            animation: answer-correct 0.42s ease-out both;
        }

        .option-item.correct .option-letter {
            background: var(--success-border);
            border-color: var(--success-border);
            color: #ffffff;
        }

        .option-item.wrong {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger-text);
        }

        .option-item.wrong.answer-reveal {
            animation: answer-wrong 0.42s ease-out both;
        }

        @keyframes answer-correct {
            0% { opacity: 0.65; transform: scale(0.985); }
            65% { opacity: 1; transform: scale(1.012); }
            100% { transform: scale(1); }
        }

        @keyframes answer-wrong {
            0% { opacity: 0.65; transform: translateX(0); }
            25% { opacity: 1; transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
            100% { transform: translateX(0); }
        }

        .option-item.wrong .option-letter {
            background: var(--danger-border);
            border-color: var(--danger-border);
            color: #ffffff;
        }

        .option-item.disabled {
            opacity: 0.78;
            cursor: default;
        }

        .option-item .option-label {
            font-weight: 700;
            color: var(--muted);
            margin-right: 0.2rem;
        }

        .answer-explanation {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.9rem 1rem;
            font-size: 0.92rem;
            line-height: 1.65;
        }

        .answer-explanation strong {
            color: var(--primary-strong);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.35rem;
        }

        .answer-explanation p {
            margin: 0;
            color: var(--text);
        }

        @media (max-width: 768px) {
            .quiz-layout {
                grid-template-columns: minmax(0, 1fr);
            }
            .quiz-layout.sidebar-collapsed {
                grid-template-columns: minmax(0, 1fr);
            }
            .module-sidebar {
                position: static;
            }
            .module-strip {
                max-height: 280px;
            }
            .question-shell {
                grid-template-columns: 1fr;
            }
            .question-status {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body data-theme="light" class="min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">
    <header class="sticky-header sticky top-0 z-50 border-b border-borderCol shadow-sm p-4">
        <div class="content-shell flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="site-title text-base sm:text-lg font-bold tracking-tight flex items-center gap-2">
                <span class="brand-badge text-white text-xs px-2.5 py-1 rounded font-mono">ITN v7.0</span> CCNA Network Practice Exam
            </h1>
            <div class="flex items-center gap-3">
                <div id="overall-timer" class="text-sm border px-3 py-1 rounded font-mono font-semibold">Time: 00:00</div>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">🌙 Dark</button>
            </div>
        </div>
    </header>

    <main class="quiz-main mx-auto w-full p-4 flex-grow my-6">
        <div class="quiz-layout" id="quiz-layout">
            <aside class="module-sidebar" aria-label="Modules and exams">
                <div class="module-sidebar-heading">
                    <span class="module-sidebar-title">Modules</span>
                    <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="module-strip" aria-expanded="true" aria-label="Collapse module list" title="Collapse module list">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
                <nav class="module-strip" id="module-strip" aria-label="Choose a module or exam">
                    <button onclick="switchModule(1)" id="tab-1" class="module-tab active" type="button">Mod 1 (Intro)</button>
                    <button onclick="switchModule(2)" id="tab-2" class="module-tab" type="button">Mod 2 (Switching/CLI)</button>
                    <button onclick="switchModule(3)" id="tab-3" class="module-tab" type="button">Mod 3 (Protocols)</button>
                    <button onclick="switchModule(4)" id="tab-4" class="module-tab" type="button">Mod 4 (Physical)</button>
                    <button onclick="switchModule(5)" id="tab-5" class="module-tab" type="button">Mod 5 (Number Systems)</button>
                    <button onclick="switchModule(6)" id="tab-6" class="module-tab" type="button">Mod 6 (Data Link)</button>
                    <button onclick="switchModule(7)" id="tab-7" class="module-tab" type="button">Mod 7 (Ethernet)</button>
                    <button onclick="switchModule(8)" id="tab-8" class="module-tab" type="button">Mod 8 (Network Layer)</button>
                    <button onclick="switchModule(9)" id="tab-9" class="module-tab" type="button">Mod 9 (IPv6)</button>
                    <button onclick="switchModule(10)" id="tab-10" class="module-tab" type="button">Mod 10 (IP Addressing)</button>
                    <button onclick="switchModule(11)" id="tab-11" class="module-tab" type="button">Mod 11 (Subnetting IPv4)</button>
                    <button onclick="switchModule(12)" id="tab-12" class="module-tab" type="button">Mod 12 (IPv6)</button>
                    <button onclick="switchModule(13)" id="tab-13" class="module-tab" type="button">Mod 13 (ICMP)</button>
                    <button onclick="switchModule(14)" id="tab-14" class="module-tab" type="button">Mod 14 (Transport)</button>
                    <button onclick="switchModule(15)" id="tab-15" class="module-tab" type="button">Mod 15 (Application)</button>
                    <button onclick="switchModule(16)" id="tab-16" class="module-tab" type="button">Mod 16 (Security)</button>
                    <button onclick="switchModule(17)" id="tab-17" class="module-tab" type="button">Mock Final</button>
                </nav>
            </aside>

            <div class="quiz-content">
                <div id="quiz-container" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-start">
                    <!-- Rendered dynamically -->
                </div>

                <div class="navigation-panel flex justify-between items-center mt-6 p-4">
                    <button onclick="prevQuestion()" id="prev-btn" class="bg-slate-200 hover:bg-slate-300 border border-borderCol text-slate-700 px-5 py-2.5 font-medium transition-all disabled:opacity-40 disabled:cursor-not-allowed">Previous</button>
                    <div id="progress-indicator" class="text-sm font-semibold text-slate-600">Question 1 of 10</div>
                    <button onclick="nextQuestion()" id="next-btn" class="bg-sky-700 hover:bg-sky-600 text-white px-6 py-2.5 font-medium shadow-sm transition-all">Next</button>
                </div>
            </div>
        </div>

        function createShuffledIndices(length, previousOrder) {
            const indices = Array.from({ length }, (_, index) => index);
            for (let index = indices.length - 1; index > 0; index--) {
                const swapIndex = Math.floor(Math.random() * (index + 1));
                [indices[index], indices[swapIndex]] = [indices[swapIndex], indices[index]];
            }

            if (indices.length > 1 && indices.every((value, index) => value === previousOrder[index])) {
                [indices[0], indices[1]] = [indices[1], indices[0]];
            }
            return indices;
        }

        function initializeAttemptOrder() {
            for (const [moduleNumber, questions] of Object.entries(quizData)) {
                const previousModuleOptionOrders = optionOrders[moduleNumber] || {};

                questionOrders[moduleNumber] = createShuffledIndices(questions.length, previousQuestionOrder);
                optionOrders[moduleNumber] = {};

                questions.forEach((question, questionIndex) => {
                    const previousOptionOrder = previousModuleOptionOrders[questionIndex]
                        || Array.from({ length: question.options.length }, (_, index) => index);
                    optionOrders[moduleNumber][questionIndex] = createShuffledIndices(

            }

            }

            const correctCount = questions.reduce((count, question, index) => {
                return count + (answers[index] === question.correct ? 1 : 0);
            }, 0);
            return { complete: true, percentage: (correctCount / questions.length) * 100 };
        }

        function updateModuleProgress() {
            document.querySelectorAll('.module-tab').forEach(button => {
                const moduleNumber = Number(button.id.replace('tab-', ''));
                const result = getModuleResult(moduleNumber);
                const status = button.querySelector('.module-progress-status');
                const track = button.querySelector('.module-progress-track');
                const fill = button.querySelector('.module-progress-fill');
                const percentageText = result.percentage % 1 === 0
                    ? `${result.percentage}%`
                    : `${result.percentage.toFixed(1)}%`;

                button.dataset.scoreState = result.complete
                    ? result.percentage >= 80 ? 'high' : result.percentage >= 50 ? 'medium' : 'low'
                    : 'incomplete';
                status.textContent = result.complete ? percentageText : 'Incomplete';
                fill.style.width = result.complete ? `${result.percentage}%` : '0%';
                track.setAttribute('aria-valuenow', String(result.complete ? result.percentage : 0));
                track.setAttribute('aria-valuetext', result.complete ? percentageText : 'Incomplete');
                button.setAttribute('aria-pressed', button.classList.contains('active') ? 'true' : 'false');
            });
        }

        function toggleModuleSidebar() {
            const sidebar = document.querySelector('.module-sidebar');
            const layout = document.getElementById('quiz-layout');
            const toggle = document.getElementById('sidebar-toggle');
            const isCollapsed = sidebar.classList.toggle('collapsed');
            layout.classList.toggle('sidebar-collapsed', isCollapsed);
            toggle.setAttribute('aria-expanded', String(!isCollapsed));
            toggle.setAttribute('aria-label', isCollapsed ? 'Expand module list' : 'Collapse module list');
            toggle.title = isCollapsed ? 'Expand module list' : 'Collapse module list';
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const seconds = String(elapsed % 60).padStart(2, '0');
                document.getElementById('overall-timer').innerText = `Time: ${minutes}:${seconds}`;
            }, 1000);
        }

        function switchModule(modNum, questionIndex = 0, animation = 'module') {
            currentModule = modNum;
            currentQuestionIndex = questionIndex;

            document.querySelectorAll('.module-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeTab = document.getElementById(`tab-${modNum}`);
            if (activeTab) {
                activeTab.classList.add('active');
            }

            updateModuleProgress();
            renderQuestion(animation);
        }

        function renderQuestion(animation = 'none') {
            const container = document.getElementById('quiz-container');
            const questions = quizData[currentModule];
            const questionIndex = questionOrders[currentModule][currentQuestionIndex];
            const q = quizData[currentModule][questionIndex];
            const savedAnswer = userAnswers[currentModule][questionIndex];
            const isFlagged = flaggedQuestions[currentModule][questionIndex] || false;
            const alphabetLabels = ['a.', 'b.', 'c.', 'd.', 'e.'];
            const animationClass = animation === 'none' ? '' : ` question-enter-${animation}`;

            let html = `
                <div class="question-shell${animationClass}">
                    <aside class="question-status">
                        <div class="question-number">Question ${currentQuestionIndex + 1}</div>
                        <div class="status-block">
                            <div class="status-inline"><span class="status-dot"></span> ${savedAnswer !== undefined ? 'Complete' : 'Not yet answered'}</div>
                            <div>Marked 0.00 out of 3.00</div>
                        </div>
                        <label class="flag-toggle" for="flag-checkbox">
                            <input type="checkbox" id="flag-checkbox" ${isFlagged ? 'checked' : ''} onchange="toggleFlag()">
                            <span>${isFlagged ? 'Remove flag' : 'Flag question'}</span>
                        </label>
                    </aside>

                    <div class="question-main">
                        <h2 class="question-text">${q.question}</h2>
                        <div class="option-list">
            `;

            optionOrders[currentModule][questionIndex].forEach((optionIndex, displayIndex) => {
                const opt = q.options[optionIndex];
                let optionClass = 'option-item';

                if (savedAnswer !== undefined) {
                    if (optionIndex === q.correct) {
                        optionClass += ' correct';
                    } else if (optionIndex === savedAnswer) {
                        optionClass += ' wrong';
                    } else {
                        optionClass += ' disabled';
                    }
                    if (animation === 'answer' && (optionIndex === q.correct || optionIndex === savedAnswer)) {
                        optionClass += ' answer-reveal';
                    }
                }

                html += `
                    <button type="button" onclick="selectOption(${optionIndex})" ${savedAnswer !== undefined ? 'disabled' : ''} class="${optionClass}">
                        <span class="option-letter">${savedAnswer !== undefined && optionIndex === q.correct ? '✓' : (savedAnswer !== undefined && optionIndex === savedAnswer && optionIndex !== q.correct ? '✕' : alphabetLabels[displayIndex].replace('.', ''))}</span>
                        <span class="option-text"><span class="option-label">${alphabetLabels[displayIndex]}</span> ${opt}</span>
                    </button>
                `;
            });

            html += `</div>`;

            if (savedAnswer !== undefined) {
                html += `
                    <div class="answer-explanation">
                        <strong>Rationale & Explanation</strong>
                        <p>${q.rationale}</p>
                    </div>
                `;
            }

            html += `</div></div>`;

            container.innerHTML = html;
            document.getElementById('progress-indicator').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            const moduleKeys = Object.keys(quizData).map(Number);
            document.getElementById('prev-btn').disabled = currentQuestionIndex === 0 && currentModule === moduleKeys[0];
            updateModuleProgress();
        }

        function selectOption(optIndex) {
            const questionIndex = questionOrders[currentModule][currentQuestionIndex];
            userAnswers[currentModule][questionIndex] = optIndex;
            renderQuestion('answer');
        }

        function toggleFlag() {
            const isChecked = document.getElementById('flag-checkbox').checked;
            const questionIndex = questionOrders[currentModule][currentQuestionIndex];
            flaggedQuestions[currentModule][questionIndex] = isChecked;
            renderQuestion();
        }

        function nextQuestion() {
            const questions = quizData[currentModule];
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion('next');
            } else {
                const moduleKeys = Object.keys(quizData).map(Number);
                const currentIdx = moduleKeys.indexOf(currentModule);
                if (currentIdx < moduleKeys.length - 1) {
                    switchModule(moduleKeys[currentIdx + 1]);
                } else {
                    showFinalScore();
                }
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion('previous');
            } else {
                const moduleKeys = Object.keys(quizData).map(Number);
                const currentIdx = moduleKeys.indexOf(currentModule);
                if (currentIdx > 0) {
                    const prevMod = moduleKeys[currentIdx - 1];
                    switchModule(prevMod, quizData[prevMod].length - 1, 'previous');
                }
            }
        }

        function showFinalScore() {
            clearInterval(timerInterval);
            let totalCorrect = 0;
            let totalQuestions = 0;

            for (let mod in quizData) {
                quizData[mod].forEach((q, idx) => {
                    totalQuestions++;
                    if (userAnswers[mod][idx] === q.correct) {
                        totalCorrect++;
                    }
                });
            }

            const percentage = Math.round((totalCorrect / totalQuestions) * 100);
            const container = document.getElementById('quiz-container');
            container.innerHTML = `
                <div class="completed-panel col-span-4 p-10 rounded-xl text-center space-y-6">
                    <h2 class="text-3xl font-extrabold">Practice Exam Completed! 🎉</h2>
                    <p class="text-lg">You answered <span class="score-value font-bold">${totalCorrect}</span> out of <span class="font-bold">${totalQuestions}</span> questions correctly.</p>
                    <div class="success-rate inline-block p-5 rounded-2xl font-bold text-xl">
                        Success Rate: ${percentage}%
                    </div>
                    <div>
                        <button onclick="resetQuiz()" class="bg-sky-700 hover:bg-sky-600 text-white px-8 py-3 rounded-xl font-semibold shadow-sm transition-all">Retake Quiz</button>
                    </div>
                </div>
            `;
            document.getElementById('prev-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('progress-indicator').style.display = 'none';
        }

        function resetQuiz() {
            for (let mod in quizData) {
                userAnswers[mod] = {};
                flaggedQuestions[mod] = {};
            }
            initializeAttemptOrder();
            startTime = Date.now();
            startTimer();
            document.getElementById('prev-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'inline-block';
            document.getElementById('progress-indicator').style.display = 'block';
            const moduleKeys = Object.keys(quizData).map(Number);
            switchModule(moduleKeys[0]);
        }

        function applyTheme(theme) {
            const body = document.body;
            const safeTheme = theme === 'dark' ? 'dark' : 'light';
            body.dataset.theme = safeTheme;
            const themeBtn = document.getElementById('theme-toggle');
            if (themeBtn) {
                themeBtn.textContent = safeTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
                themeBtn.setAttribute('aria-label', safeTheme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
            }
            try {
                localStorage.setItem('cn-theme', safeTheme);
            } catch (error) {
                // Ignore storage errors in restricted browser contexts.
            }
        }

        function toggleTheme() {
            const body = document.body;
            const nextTheme = body.dataset.theme === 'dark' ? 'light' : 'dark';
            applyTheme(nextTheme);
        }

        const savedTheme = (() => {
            try {
                return localStorage.getItem('cn-theme');
            } catch (error) {
                return null;
            }
        })();

        applyTheme(savedTheme || 'light');
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        document.getElementById('sidebar-toggle').addEventListener('click', toggleModuleSidebar);

        initializeModuleSidebar();
        updateModuleProgress();
        initializeAttemptOrder();
        startTimer();
        const initialModuleKeys = Object.keys(quizData).map(Number);
        switchModule(initialModuleKeys[0]);
    </script>
</body>
</html>
